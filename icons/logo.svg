<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="KS Billing Nepal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="0.52" stop-color="#0a3350"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="24%" r="68%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6c453" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#00101f" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" fill="url(#dots)" opacity="0.10"/>
  <ellipse cx="256" cy="244" rx="188" ry="132" fill="url(#goldGlow)"/>

  <circle cx="256" cy="256" r="198" fill="none" stroke="#f6c453" stroke-opacity="0.20" stroke-width="1.6"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <circle cx="256" cy="64" r="11" fill="url(#gold)"/>
  <path d="M182 112 L225 79 L258 106 L299 71 L330 112" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="256" y="300" text-anchor="middle" font-family="Lato, sans-serif" font-weight="900" font-size="160" letter-spacing="-8" fill="#ffffff" filter="url(#shadow)">KS</text>

  <path d="M178 346 H234" fill="none" stroke="#f6c453" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M278 346 H334" fill="none" stroke="#f6c453" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="251" y="341" width="10" height="10" transform="rotate(45 256 346)" fill="url(#gold)"/>

  <text x="256" y="390" text-anchor="middle" font-family="Lato, sans-serif" font-weight="900" font-size="34" letter-spacing="6.5" fill="#f8fafc">BILLING</text>
  <text x="256" y="436" text-anchor="middle" font-family="Lato, sans-serif" font-weight="900" font-size="34" letter-spacing="8.5" fill="url(#gold)">NEPAL</text>
