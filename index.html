<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Offline Billing Nepal — Free VAT / PAN billing, inventory &amp; stock</title>
<meta name="description" content="Free, fully offline billing app for Nepal. VAT and PAN invoices, inventory, stock management, purchases, customers and reports. Works for kirana shops, hotels, offices and companies. No internet, no subscription.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d4ed8'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='Arial'>₨</text></svg>">
<style>
/* ============================================================
   Offline Billing Nepal — styles
   ============================================================ */
* { box-sizing: border-box; }
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --brand: #1d4ed8;
  --brand-2: #0ea5e9;
  --ok: #059669;
  --warn: #d97706;
  --danger: #dc2626;
  --sidebar: #0b1220;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05);
}
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
h1, h2, h3, h4 { margin: 0; }
.ico { width: 18px; height: 18px; flex: 0 0 auto; display: inline-block; vertical-align: -3px; }
.muted { color: var(--muted); font-size: 12px; }
.red-text { color: #b91c1c !important; }
.green-text { color: #047857 !important; }
.full { width: 100%; justify-content: center; }
.spacer { flex: 1; }

/* ---------- app layout ---------- */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 250px; flex: 0 0 250px; height: 100vh; position: sticky; top: 0;
  background: linear-gradient(180deg, #0b1220 0%, #101c33 100%);
  color: #cbd5e1; display: flex; flex-direction: column; padding: 18px 14px; z-index: 40;
}
.brand { display: flex; gap: 11px; align-items: center; padding: 4px 8px 18px; }
.brand-logo {
  width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex: 0 0 44px;
  display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, #2563eb, #0ea5e9);
  box-shadow: 0 6px 18px rgba(37, 99, 235, .35);
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-text { min-width: 0; }
.brand-name { color: #fff; font-weight: 700; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-sub { font-size: 10.5px; color: #93a4bd; margin-top: 2px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border: 0; border-radius: 10px;
  background: transparent; color: #cbd5e1; font-size: 13.5px; font-weight: 500; text-align: left; transition: background .15s, color .15s;
}
.nav-link:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav-link.active {
  background: linear-gradient(90deg, rgba(37, 99, 235, .95), rgba(14, 165, 233, .72));
  color: #fff; box-shadow: 0 6px 16px rgba(37, 99, 235, .25);
}
.sidebar-foot { margin-top: auto; padding: 14px 8px 4px; border-top: 1px solid rgba(255, 255, 255, .08); font-size: 10.5px; color: #93a4bd; }
.offline-chip { display: flex; align-items: center; gap: 6px; color: #86efac; font-weight: 600; margin-bottom: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .18); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 13px 24px; background: rgba(255, 255, 255, .88); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.page-title h1 { font-size: 19px; letter-spacing: -.01em; }
.page-title p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.today { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.35; }
.today strong { color: #334155; font-size: 11.5px; }
.menu-btn { display: none; }
#view { padding: 22px 24px 60px; width: 100%; max-width: 1440px; margin: 0 auto; }
.nav-overlay { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: #fff; color: #1e293b;
  padding: 9px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .05s; white-space: nowrap;
}
.btn:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #1d4ed8; color: #fff; box-shadow: 0 5px 14px rgba(37, 99, 235, .22); }
.btn.primary:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
.btn.success { background: #059669; border-color: #059669; color: #fff; }
.btn.success:hover { background: #047857; }
.btn.danger { background: #fff5f5; border-color: #fecaca; color: #b91c1c; }
.btn.danger:hover { background: #fee2e2; }
.btn.ghost { background: transparent; border-color: transparent; color: #475569; }
.btn.ghost:hover { background: #f1f5f9; }
.btn.sm { padding: 6px 9px; font-size: 11.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn {
  width: 30px; height: 30px; display: inline-grid; place-items: center; border: 1px solid transparent;
  border-radius: 8px; background: transparent; color: #64748b;
}
.icon-btn:hover { background: #f1f5f9; color: #1e293b; }
.icon-btn.danger:hover { background: #fee2e2; color: #b91c1c; }
.icon-btn .ico { width: 16px; height: 16px; }

/* ---------- cards / layout ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-width: 0; }
.card-head > * { min-width: 0; }
.grid-2 > *, .bill-layout > *, .stack > *, .stat { min-width: 0; }
.card-head h2 { font-size: 14.5px; letter-spacing: -.01em; }
.card-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 15px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; right: -20px; top: -20px; width: 70px; height: 70px; border-radius: 50%; background: #eff6ff; }
.stat .label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .value { font-size: 22px; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; position: relative; }
.stat .hint { font-size: 11px; color: var(--muted); margin-top: 3px; position: relative; }
.stat.tone-blue::after { background: #dbeafe; }
.stat.tone-green::after { background: #d1fae5; }
.stat.tone-amber::after { background: #fef3c7; }
.stat.tone-violet::after { background: #ede9fe; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 11.5px; font-weight: 600; color: #334155; }
.field small { font-size: 10.5px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline > label { white-space: nowrap; }
.span-2 { grid-column: span 2; }
.input {
  width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 8px 10px;
  background: #fff; font-size: 12.5px; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
textarea.input { resize: vertical; min-height: 38px; }
select.input { appearance: auto; }
.check { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #334155; font-weight: 500; }
.check input { accent-color: #2563eb; width: 15px; height: 15px; }
.notice {
  margin-top: 12px; padding: 9px 11px; border-radius: 9px; font-size: 11.5px;
  background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe;
}
.form-actions { margin-top: 16px; display: flex; gap: 8px; }

/* ---------- toolbar ---------- */
.toolbar { margin-bottom: 16px; padding: 14px 16px; }
.toolbar-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.toolbar-row + .toolbar-row { margin-top: 10px; }
.search-box { position: relative; flex: 1 1 240px; min-width: 180px; }
.search-box .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #94a3b8; }
.search-box .input { padding-left: 32px; }
.preset-row { display: flex; gap: 5px; flex-wrap: wrap; }

/* ---------- tables ---------- */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  background: #f8fafc; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: #64748b; padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700;
}
td { padding: 9px 11px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f8fafc; }
.r { text-align: right; }
.c { text-align: center; }
.actions { white-space: nowrap; }
.actions .btn + .btn, .actions .btn + .icon-btn, .actions .icon-btn + .icon-btn { margin-left: 3px; }
.sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

/* ---------- badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 700; white-space: nowrap; letter-spacing: .01em;
}
.badge.green { background: #dcfce7; color: #166534; }
.badge.red { background: #fee2e2; color: #991b1b; }
.badge.amber { background: #fef3c7; color: #92400e; }
.badge.blue { background: #dbeafe; color: #1e40af; }
.badge.gray { background: #f1f5f9; color: #475569; }

/* ---------- empty / lists ---------- */
.empty { padding: 34px 18px; text-align: center; color: var(--muted); font-size: 12.5px; }
.empty .big { font-size: 30px; margin-bottom: 8px; color: #cbd5e1; }
.empty .big .ico { width: 34px; height: 34px; }
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; }
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .name { font-size: 12.5px; font-weight: 600; }
.list-item .sub { font-size: 10.5px; }

/* ---------- hero / dashboard ---------- */
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: linear-gradient(120deg, #0f172a 0%, #1e3a8a 60%, #0369a1 100%);
  color: #fff; border-radius: 18px; padding: 22px 24px; margin-bottom: 16px;
  box-shadow: 0 12px 30px rgba(30, 58, 138, .18);
}
.hero h2 { font-size: 21px; letter-spacing: -.02em; }
.hero p { margin: 4px 0 0; font-size: 12px; color: #c7d2fe; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero .btn { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .22); color: #fff; }
.hero .btn:hover { background: rgba(255, 255, 255, .18); }
.hero .btn.primary { background: #fff; color: #1d4ed8; border-color: #fff; }
.hero .btn.primary:hover { background: #eff6ff; }

/* ---------- chart ---------- */
.chart { display: flex; align-items: flex-end; gap: 8px; height: 185px; padding-top: 8px; }
.chart-col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.chart-bar { width: 100%; max-width: 44px; border-radius: 7px 7px 2px 2px; background: linear-gradient(180deg, #60a5fa, #2563eb); min-height: 3px; transition: height .25s; }
.chart-val { font-size: 9px; color: #475569; font-weight: 700; white-space: nowrap; }
.chart-label { font-size: 9.5px; color: var(--muted); }

/* ---------- billing ---------- */
.bill-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.sticky { position: sticky; top: 84px; }
.segmented { display: inline-flex; background: #f1f5f9; border-radius: 10px; padding: 3px; gap: 2px; }
.segmented button { border: 0; background: transparent; padding: 7px 11px; border-radius: 8px; font-size: 11.5px; font-weight: 700; color: #64748b; }
.segmented button.active { background: #fff; color: #1d4ed8; box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }
.item-add { display: grid; grid-template-columns: minmax(180px, 2fr) 84px 105px 84px auto; gap: 8px; margin-bottom: 12px; }
.cell-input {
  width: 76px; border: 1px solid transparent; background: #f8fafc; border-radius: 6px;
  padding: 4px 5px; font-size: 11.5px; text-align: right; outline: none;
}
.cell-input:focus { border-color: #93c5fd; background: #fff; box-shadow: 0 0 0 2px rgba(37, 99, 235, .1); }
.totals { display: flex; flex-direction: column; gap: 7px; }
.totals > div { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: #475569; }
.totals > div b { color: #1e293b; }
.totals .grand { border-top: 2px solid var(--line); margin-top: 3px; padding-top: 9px; font-size: 14px; color: var(--text); align-items: baseline; }
.totals .grand b { font-size: 20px; color: #1d4ed8; letter-spacing: -.02em; }
.big-totals > div { font-size: 13px; padding: 2px 0; }
.pay-lines { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 11.5px; color: #475569; }
.pay-lines b { color: #1e293b; }
.summary-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.pay-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.pay-summary > div { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.pay-summary b { font-size: 14px; color: #1e293b; }

/* ---------- settings ---------- */
.logo-row { display: flex; gap: 14px; align-items: center; }
.logo-preview { width: 76px; height: 76px; border-radius: 14px; border: 1px dashed #cbd5e1; background: #f8fafc; display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 11px; flex: 0 0 76px; }
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }
.logo-actions { display: flex; flex-direction: column; gap: 6px; font-size: 11px; }
.logo-actions input[type="file"] { font-size: 11px; max-width: 230px; }
.stack-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

/* ---------- preview / modal ---------- */
.preview-note { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
.invoice-preview { background: #e2e8f0; border-radius: 12px; padding: 14px; overflow: auto; max-height: 64vh; }
.invoice-preview .inv-sheet.a4 { width: 100%; min-height: 0; padding: 9mm; box-shadow: 0 2px 14px rgba(15, 23, 42, .15); }
.invoice-preview .inv-sheet.thermal { width: 300px; box-shadow: 0 2px 14px rgba(15, 23, 42, .15); }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(15, 23, 42, .58);
  display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow: auto;
}
.modal {
  background: #fff; border-radius: 16px; width: 100%; max-width: 600px;
  box-shadow: 0 26px 70px rgba(2, 6, 23, .38); display: flex; flex-direction: column; max-height: 92vh;
  animation: modalPop .16s ease-out;
}
.modal.wide { max-width: 980px; }
@keyframes modalPop { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 15px 19px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 15.5px; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: 18px 19px; overflow: auto; }
.modal-foot { padding: 13px 19px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
body.modal-open { overflow: hidden; }

#toastRoot { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: #0f172a; color: #fff; padding: 10px 13px; border-radius: 10px; font-size: 12px;
  box-shadow: 0 12px 30px rgba(2, 6, 23, .3); display: flex; gap: 8px; align-items: center;
  transition: opacity .3s, transform .3s; max-width: 360px;
}
.toast .ico { width: 16px; height: 16px; }
.toast.ok { border-left: 4px solid #22c55e; }
.toast.error { border-left: 4px solid #ef4444; }
.toast.warn { border-left: 4px solid #f59e0b; }

/* ---------- welcome ---------- */
.welcome-hero { background: linear-gradient(120deg, #0f172a, #1e3a8a 60%, #0369a1); color: #fff; border-radius: 14px; padding: 20px; }
.welcome-badge { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: rgba(255, 255, 255, .14); padding: 4px 8px; border-radius: 999px; margin-bottom: 10px; }
.welcome-hero h2 { font-size: 22px; letter-spacing: -.02em; }
.welcome-hero p { margin: 8px 0 0; font-size: 12.5px; color: #c7d2fe; max-width: 640px; }
.welcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.welcome-item { display: flex; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: #f8fafc; }
.welcome-item .ico { width: 20px; height: 20px; color: #1d4ed8; margin-top: 2px; }
.welcome-item div { display: flex; flex-direction: column; gap: 2px; }
.welcome-item strong { font-size: 12.5px; }
.welcome-item span { font-size: 11px; color: var(--muted); }

/* ---------- invoice sheet ---------- */
.inv-sheet { background: #fff; color: #111827; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; line-height: 1.45; }
.inv-sheet.a4 { width: 210mm; min-height: 297mm; padding: 12mm; margin: 0 auto; }
.inv-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
.inv-brand { display: flex; gap: 11px; align-items: flex-start; }
.inv-logo { width: 54px; height: 54px; object-fit: contain; border-radius: 8px; }
.inv-biz { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.inv-tag { font-size: 10px; color: #6b7280; margin-top: 1px; }
.inv-meta { font-size: 10px; color: #374151; line-height: 1.5; }
.inv-title { text-align: right; flex: 0 0 auto; }
.inv-type { display: inline-block; border: 2px solid #111827; padding: 3px 9px; border-radius: 3px; font-weight: 800; letter-spacing: .09em; font-size: 12px; }
.inv-no { font-size: 11px; margin-top: 5px; font-weight: 700; }
.inv-rule { border: 0; border-top: 1.5px solid #111827; margin: 10px 0; }
.inv-parties { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; margin-bottom: 10px; }
.inv-label { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; font-weight: 700; margin-bottom: 3px; }
.inv-party-name { font-weight: 700; font-size: 12px; }
.inv-meta-table { width: 100%; border-collapse: collapse; font-size: 10px; }
.inv-meta-table td { padding: 1px 0; border: 0; }
.inv-meta-table td:first-child { color: #6b7280; }
.inv-meta-table td:last-child { text-align: right; font-weight: 600; }
.inv-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
.inv-table th { background: #f3f4f6; border: 1px solid #d1d5db; padding: 5px 6px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: #374151; }
.inv-table td { border: 1px solid #e5e7eb; padding: 5px 6px; vertical-align: top; }
.inv-item-name { font-weight: 600; }
.inv-sub { font-size: 8.5px; color: #6b7280; }
.inv-totals { margin-left: auto; width: 58%; margin-top: 8px; font-size: 10.5px; }
.inv-totals .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed #e5e7eb; }
.inv-totals .grand { border-top: 2px solid #111827; border-bottom: 2px solid #111827; font-weight: 800; font-size: 13px; padding: 6px 0; margin-top: 2px; }
.inv-words { margin-top: 9px; font-size: 10px; background: #f9fafb; border: 1px dashed #d1d5db; padding: 6px 8px; border-radius: 3px; }
.inv-note-box { margin-top: 6px; font-size: 9.5px; color: #374151; }
.inv-foot { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 16px; font-size: 9.5px; color: #374151; }
.inv-sign { text-align: center; padding-top: 30px; border-top: 1px dashed #9ca3af; margin-top: 8px; font-size: 9.5px; }
.inv-note { font-size: 8.5px; color: #6b7280; margin-top: 12px; text-align: center; }

.inv-sheet.thermal { width: 80mm; padding: 3mm; font-size: 10px; margin: 0 auto; }
.thermal .t-center { text-align: center; }
.thermal .t-biz { font-size: 14px; font-weight: 800; margin-top: 2px; }
.thermal .t-rule { border-top: 1px dashed #111; margin: 5px 0; }
.thermal .t-row { display: flex; justify-content: space-between; gap: 8px; }
.thermal .t-item { margin: 4px 0; }
.thermal .t-name { font-weight: 700; }
.thermal .t-total { font-size: 13px; font-weight: 800; border-top: 1px solid #111; border-bottom: 1px solid #111; padding: 3px 0; margin: 3px 0; }

/* report sheet */
.rep-sheet { background: #fff; color: #111827; width: 210mm; margin: 0 auto; padding: 12mm; font-size: 10.5px; }
.rep-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
.rep-biz { font-size: 18px; font-weight: 800; }
.rep-meta { font-size: 9.5px; color: #4b5563; }
.rep-title { text-align: right; font-size: 10px; }
.rep-type { border: 2px solid #111827; display: inline-block; padding: 3px 8px; font-weight: 800; letter-spacing: .08em; margin-bottom: 4px; }
.rep-table { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 9.5px; }
.rep-table th, .rep-table td { border: 1px solid #d1d5db; padding: 4px 6px; }
.rep-table th { background: #f3f4f6; text-align: left; }
.rep-sheet h3 { font-size: 11px; margin: 12px 0 4px; }
.rep-foot { margin-top: 14px; font-size: 8.5px; color: #6b7280; text-align: center; }

  const bs = adToBs(iso);
  if (!bs) return '';
  return `${bs.year}-${pad2(bs.month + 1)}-${pad2(bs.day)} (${BS_MONTHS[bs.month]} ${bs.day}, ${bs.year})`;
}
function bsShort(iso) {
  const bs = adToBs(iso);
  return bs ? `${bs.year}-${pad2(bs.month + 1)}-${pad2(bs.day)}` : '';
}
function fiscalYear(iso) {
  const bs = adToBs(iso || todayISO());
  if (!bs) return String(new Date().getFullYear());
  const fy = bs.month >= 3 ? bs.year : bs.year - 1;
  return `${fy}/${pad2((fy + 1) % 100)}`;
}
function fiscalCompact(iso) { return fiscalYear(iso).replace('/', '-'); }

/* ---------------- amount in words (Nepali/Indian system) ---------------- */
const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function twoWords(n) {
  if (n < 20) return ONES[n];
  return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
}
function intWords(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'Zero';
  const out = [];
  const units = [[10000000, 'Crore'], [100000, 'Lakh'], [1000, 'Thousand'], [100, 'Hundred']];
  for (const [v, name] of units) {
    if (n >= v) {
      out.push(intWords(Math.floor(n / v)) + ' ' + name);
      n %= v;
    }
  }
  if (n > 0) {
    if (out.length) out.push('and');
    out.push(twoWords(n));
  }
  return out.join(' ');
}
function amountInWords(amount) {
  return intWords(Math.round(Math.abs(num(amount)))) + ' Rupees Only';
}

/* ---------------- calculation ---------------- */
function lineCalc(item, type, defaultRate) {
  const qty = num(item.qty);
  const rate = num(item.rate);
  const disc = Math.max(0, Math.min(100, num(item.disc)));
  const gross = r2(qty * rate);
  const discount = r2(gross * disc / 100);
  const net = r2(gross - discount);
  const vatRate = item.vatRate === undefined || item.vatRate === null ? num(defaultRate) : num(item.vatRate);
  const vatAmount = type === 'vat' && item.vat !== false ? r2(net * vatRate / 100) : 0;
  return { gross, discount, net, vatAmount, total: r2(net + vatAmount), vatRate };
}
function billTotals(d) {
  let subtotal = 0, discount = 0, taxable = 0, vat = 0;
  (d.items || []).forEach((it) => {
    const c = lineCalc(it, d.type, S().vatRate);
    subtotal += c.gross;
    discount += c.discount;
    taxable += c.net;
    vat += c.vatAmount;
  });
  return { subtotal: r2(subtotal), discount: r2(discount), taxable: r2(taxable), vat: r2(vat), total: r2(taxable + vat) };
}
function itemNet(it, type) {
  if (it.net !== undefined && it.net !== null) return num(it.net);
  return lineCalc(it, type, S().vatRate).net;
}
function itemVat(it, type) {
  if (it.vatAmount !== undefined && it.vatAmount !== null) return num(it.vatAmount);
  return lineCalc(it, type, S().vatRate).vatAmount;
}
function invoiceStatus(inv) {
  if (inv.type === 'estimate') return 'estimate';
  const due = r2(num(inv.total) - num(inv.received));
  if (due <= 0.009) return 'paid';
  if (num(inv.received) > 0) return 'partial';
  return 'unpaid';
}
function calcPurchase(p) {
  let subtotal = 0;
  (p.items || []).forEach((it) => { subtotal += num(it.qty) * num(it.rate); });
  subtotal = r2(subtotal);
  const vat = p.vat ? r2(subtotal * num(p.vatRate) / 100) : 0;
  return { subtotal, vat, total: r2(subtotal + vat) };
}
function nextInvoiceNo(date) {
  return `${S().invoicePrefix || 'INV'}-${fiscalCompact(date || todayISO())}-${pad4((DB.counters.invoice || 0) + 1)}`;
}
function nextPurchaseNo(date) {
  return `PUR-${fiscalCompact(date || todayISO())}-${pad4((DB.counters.purchase || 0) + 1)}`;
}
function isLowStock(p) {
  return p.track !== false && num(p.stock) <= num(p.lowStock ?? 0);
}
function typeLabel(type) {
  return type === 'vat' ? 'VAT Bill' : type === 'pan' ? 'PAN Bill' : 'Estimate';
}

function toast(message, type = 'ok') {

/* ---------------- global events ---------------- */
document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
  const nav = e.target.closest('[data-page]');
  if (nav) { e.preventDefault(); navigate(nav.dataset.page); return; }
  const actionEl = e.target.closest('[data-act]');
  if (!actionEl) return;
  const action = actionEl.dataset.act;
  if (!action) return;
  e.preventDefault();
  handleAction(action, actionEl.dataset.id, actionEl, actionEl.dataset.idx);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function handleAction(action, id, el, idx) {
  switch (action) {
    case 'close-modal': closeModal(); break;
    case 'new-bill': draft = null; navigate('billing'); break;
    case 'bill-type': if (draft) { draft.type = id; render(); } break;
    case 'add-item': addBillItem(); break;
    case 'remove-item': if (draft) { draft.items.splice(Number(idx), 1); render(); } break;
    case 'bill-save': saveBill(false); break;
    case 'bill-save-print': saveBill(true); break;
    case 'bill-clear':
      if (draft && draft.items.length && !confirm('Clear this bill and remove all items?')) return;
      draft = null; render(); break;
    case 'bill-full-pay':
      if (draft) { draft.received = billTotals(draft).total; render(); } break;
    case 'view-invoice': openInvoicePreview(DB.invoices.find((i) => i.id === id)); break;
    case 'print-invoice': {
      const inv = DB.invoices.find((i) => i.id === id);
      if (inv) printInvoice(inv, el.dataset.size || 'a4');
      break;
    }
    case 'pay-invoice': openPaymentModal(id); break;
    case 'del-invoice': deleteInvoice(id); break;
    case 'new-product': openProductModal(null, el.dataset.for === 'bill'); break;
    case 'edit-product': openProductModal(id); break;
    case 'del-product': deleteProduct(id); break;
    case 'stock-in': openStockIn(id); break;
    case 'adjust-stock': openAdjust(id); break;
    case 'product-history': openProductHistory(id); break;
    case 'new-party': openPartyModal(null, el.dataset.type || ui.partyTab, el.dataset.for === 'bill' ? afterNewBillParty : null); break;
    case 'edit-party': openPartyModal(id); break;
    case 'del-party': deleteParty(id); break;
    case 'party-tab': ui.partyTab = id; render(); break;
    case 'new-purchase': purchaseDraft = { date: todayISO(), partyId: '', supplierBillNo: '', vat: true, vatRate: S().vatRate, items: [], note: '' }; render(); break;
    case 'cancel-purchase': purchaseDraft = null; render(); break;
    case 'add-purchase-item': addPurchaseItem(); break;
    case 'remove-purchase-item': if (purchaseDraft) { purchaseDraft.items.splice(Number(idx), 1); render(); } break;
    case 'save-purchase': savePurchase(); break;
    case 'view-purchase': openPurchaseView(id); break;
    case 'del-purchase': deletePurchase(id); break;
    case 'welcome-fresh': closeModal(); navigate('settings'); break;
    case 'welcome-demo': closeModal(); loadDemoData(); break;
    case 'export-backup': exportBackup(); break;
    case 'import-backup': { const f = $('#importFile'); if (f) f.click(); else toast('Open Settings to import a backup', 'warn'); break; }
    case 'load-demo': closeModal(); loadDemoData(); break;
    case 'reset-all': resetAll(); break;
    case 'remove-logo': S().logo = ''; saveDB(); render(); toast('Logo removed'); break;
    case 'export-sales': exportSalesCSV(); break;
    case 'export-vat': exportVatCSV(); break;
    case 'export-stock': exportStockCSV(); break;
    case 'print-report': printReport(); break;
    case 'report-preset': setReportPreset(id); break;
    default: break;
  }
}

function dashboardData() {

  const sales = DB.invoices.filter((i) => i.type !== 'estimate');
  const todaySales = sales.filter((i) => i.date === today).reduce((a, i) => a + num(i.total), 0);
  const monthSales = sales.filter((i) => i.date.startsWith(month)).reduce((a, i) => a + num(i.total), 0);
  const unpaid = sales.reduce((a, i) => a + Math.max(0, num(i.total) - num(i.received)), 0);
  const low = DB.products.filter(isLowStock);
  const stockValue = DB.products.reduce((a, p) => a + (p.track === false ? 0 : num(p.stock) * num(p.cost)), 0);
  const monthCount = sales.filter((i) => i.date.startsWith(month)).length;
  return { todaySales, monthSales, unpaid, low, stockValue, monthCount, sales };
}

function mountBilling() {
  const d = ensureDraft();
  const dateEl = $('#billDate');
  if (dateEl) dateEl.addEventListener('change', () => { d.date = dateEl.value || todayISO(); render(); });
  const dueEl = $('#billDue');
  if (dueEl) dueEl.addEventListener('change', () => { d.dueDate = dueEl.value; });
  const payEl = $('#billPayment');
  if (payEl) payEl.addEventListener('change', () => { d.payment = payEl.value; });
  const partySel = $('#billPartySel');
  if (partySel) partySel.addEventListener('change', () => {
    const p = DB.parties.find((x) => x.id === partySel.value);
    if (p) {
      d.partyId = p.id;
      d.party = { name: p.name, phone: p.phone || '', address: p.address || '', pan: p.pan || '', vat: p.vat || '' };
    } else {
      d.partyId = '';
      d.party = { name: '', phone: '', address: '', pan: '', vat: '' };
    }
    render();
  });
  const bindParty = (sel, field) => {
    const el = $(sel);
    if (el) el.addEventListener('input', () => { d.party[field] = el.value; });
  };
  bindParty('#billPartyName', 'name');
  bindParty('#billPartyPhone', 'phone');
  bindParty('#billPartyPan', 'pan');
  bindParty('#billPartyAddress', 'address');
  const noteEl = $('#billNote');
  if (noteEl) noteEl.addEventListener('input', () => { d.note = noteEl.value; });
  const recEl = $('#billReceived');
  if (recEl) recEl.addEventListener('input', () => { d.received = num(recEl.value); updateBillUI(); });
  const prodEl = $('#itemProduct');
  if (prodEl) prodEl.addEventListener('change', () => {
    const opt = prodEl.selectedOptions[0];
    if (opt && opt.value) {
      $('#itemRate').value = opt.dataset.price || '';
      $('#itemQty').value = 1;
      $('#itemDisc').value = 0;
      $('#itemQty').focus();
    }
  });
  const itemsBody = $('#billItems');
  if (itemsBody) itemsBody.addEventListener('input', (e) => {
    const inp = e.target.closest('.cell-input');
    if (!inp) return;
    const i = Number(inp.dataset.idx);
    const field = inp.dataset.field;
    if (!d.items[i]) return;
    d.items[i][field] = num(inp.value);
    updateBillUI();
  });
}

function updateBillUI() {
  const d = ensureDraft();
  const t = billTotals(d);
  const set = (sel, val) => { const el = $(sel); if (el) el.textContent = val; };
  set('#sumSubtotal', money(t.subtotal));
  set('#sumDiscount', money(t.discount));
  set('#sumTaxable', money(t.taxable));
  set('#sumVat', money(t.vat));
  set('#sumTotal', money(t.total));
  set('#sumDue', money(Math.max(0, t.total - num(d.received))));
  set('#sumChange', money(Math.max(0, num(d.received) - t.total)));
  $$('#billItems tr[data-idx]').forEach((tr) => {
    const i = Number(tr.dataset.idx);
    const it = d.items[i];
    if (!it) return;
    const c = lineCalc(it, d.type, S().vatRate);
    const vatCell = tr.querySelector('.line-vat');
    const totalCell = tr.querySelector('.line-total');
    if (vatCell) vatCell.textContent = money(c.vatAmount);
    if (totalCell) totalCell.innerHTML = `<strong>${money(c.total)}</strong>`;
  });
}

function addBillItem() {
  const d = ensureDraft();
  const sel = $('#itemProduct');
  const pid = sel ? sel.value : '';
  if (!pid) { toast('Select a product first', 'warn'); return; }
  const p = DB.products.find((x) => x.id === pid);
  if (!p) return;
  const qty = num($('#itemQty').value) || 1;
  if (qty <= 0) { toast('Quantity must be greater than zero', 'warn'); return; }
  if (d.type !== 'estimate' && p.track !== false) {
    const already = r2(d.items.filter((it) => it.productId === p.id).reduce((a, it) => a + num(it.qty), 0));
    const available = r2(num(p.stock) - already);
    if (qty > available) {
      toast(`Only ${available} ${p.unit || 'unit'} of ${p.name} left for this bill`, 'error');
      return;
    }
  }
  const rate = $('#itemRate').value === '' ? num(p.price) : num($('#itemRate').value);
  const disc = Math.max(0, Math.min(100, num($('#itemDisc').value)));
  d.items.push({
    productId: p.id, name: p.name, sku: p.sku || '', unit: p.unit || '', qty, rate, disc,
    vat: p.vat !== false, vatRate: num(S().vatRate), cost: num(p.cost),
  });
  render();
  setTimeout(() => { const q = $('#itemQty'); if (q) { q.value = 1; q.focus(); } }, 40);
}

function saveBill(autoPrint) {
  const d = ensureDraft();
  if (!d.items.length) { toast('Add at least one item to the bill', 'warn'); return; }
  const bad = d.items.find((it) => num(it.qty) <= 0 || num(it.rate) < 0);
  if (bad) { toast('Check quantity and rate of every item', 'warn'); return; }
  const totals = billTotals(d);
  if (d.type !== 'estimate') {
    const needed = new Map();
    d.items.forEach((it) => {
      const p = DB.products.find((x) => x.id === it.productId);
      if (p && p.track !== false) needed.set(p.id, r2((needed.get(p.id) || 0) + num(it.qty)));
    });
    for (const [pid, qty] of needed) {
      const p = DB.products.find((x) => x.id === pid);
      if (p && qty > num(p.stock)) {
        toast(`Not enough stock for ${p.name}: ${num(p.stock)} available, ${qty} on this bill`, 'error');
        return;
      }
    }
  }
  const received = d.type === 'estimate' ? 0 : Math.max(0, num(d.received));
  const partyName = (d.party.name || '').trim() || 'Walk-in Customer';
  const inv = {
    id: uid(),
    no: nextInvoiceNo(d.date),
    type: d.type,
    date: d.date || todayISO(),
    dueDate: d.dueDate || '',
    partyId: d.partyId || '',
    party: { ...d.party, name: partyName },
    items: d.items.map((it) => {
      const c = lineCalc(it, d.type, S().vatRate);
      return {
        productId: it.productId, name: it.name, sku: it.sku || '', unit: it.unit || '',
        qty: num(it.qty), rate: num(it.rate), disc: num(it.disc), vat: it.vat !== false,
        vatRate: c.vatRate, vatAmount: c.vatAmount, net: c.net, total: c.total, cost: num(it.cost),
      };
    }),
    subtotal: totals.subtotal,
    discount: totals.discount,
    taxable: totals.taxable,
    vat: totals.vat,
    total: totals.total,
    received: r2(received),
    due: r2(Math.max(0, totals.total - received)),
    change: r2(Math.max(0, received - totals.total)),
    payment: d.payment,
    note: (d.note || '').trim(),
    status: '',
    createdAt: new Date().toISOString(),
  };
  inv.status = invoiceStatus(inv);
  if (d.type !== 'estimate') {
    inv.items.forEach((it) => {
      const p = DB.products.find((x) => x.id === it.productId);
      if (p && p.track !== false) p.stock = r2(num(p.stock) - num(it.qty));
    });
  }
  DB.invoices.unshift(inv);
  DB.counters.invoice = (DB.counters.invoice || 0) + 1;
  saveDB();
  draft = null;
  render();
  openInvoicePreview(inv, autoPrint);
  toast(`Invoice ${inv.no} saved`);
}

function openInvoicePreview(inv, autoPrint) {
  if (!inv) return;
  openModal({
    title: `Invoice ${esc(inv.no)}`,
    wide: true,
    body: `<div class="preview-note">Print, save as PDF, or close. Use your browser's print dialog to choose a printer.</div><div class="invoice-preview">${invoiceTemplate(inv, 'a4')}</div>`,
    footer: `
      <button type="button" class="btn" data-act="print-invoice" data-id="${inv.id}" data-size="thermal">${ico('print')} Thermal 80mm</button>
      <button type="button" class="btn primary" data-act="print-invoice" data-id="${inv.id}" data-size="a4">${ico('print')} Print A4</button>
      <button type="button" class="btn ghost" data-act="close-modal">Close</button>`,
  });
  if (autoPrint) setTimeout(() => printInvoice(inv, 'a4'), 400);
}

function openPaymentModal(id) {
  const inv = DB.invoices.find((i) => i.id === id);
  if (!inv) return;
  const due = r2(num(inv.total) - num(inv.received));
  openModal({
    title: `Record payment · ${esc(inv.no)}`,
    body: `<form id="paymentForm">
      <div class="pay-summary">
        <div><span>Grand total</span><b>${money(inv.total)}</b></div>
        <div><span>Already received</span><b>${money(inv.received)}</b></div>
        <div><span>Balance due</span><b class="red-text">${money(due)}</b></div>
      </div>
      <div class="form-grid" style="margin-top:14px">
        <div class="field"><label>Amount received now</label><input class="input" name="amount" type="number" min="0" step="any" value="${due > 0 ? due : 0}" required></div>
        <div class="field"><label>Method</label><select class="input" name="method">${['Cash', 'Card', 'eSewa', 'Khalti', 'Bank Transfer', 'Other'].map((m) => `<option ${inv.payment === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
      </div>
    </form>`,
    footer: `<button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button type="submit" form="paymentForm" class="btn primary">Save payment</button>`,
  });
  $('#paymentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const amount = num(new FormData(e.target).get('amount'));
    if (amount <= 0) { toast('Enter a payment amount', 'warn'); return; }
    inv.received = r2(num(inv.received) + amount);
    inv.due = r2(Math.max(0, num(inv.total) - inv.received));
    inv.change = r2(Math.max(0, inv.received - num(inv.total)));
    inv.payment = new FormData(e.target).get('method');
    inv.status = invoiceStatus(inv);
    saveDB();
    closeModal();
    render();
    toast('Payment recorded');
  });
}

function deleteInvoice(id) {
  const inv = DB.invoices.find((i) => i.id === id);
  if (!inv) return;
  if (!confirm(`Delete invoice ${inv.no}? Stock will be restored for billed items.`)) return;
  if (inv.type !== 'estimate') {
    inv.items.forEach((it) => {
      const p = DB.products.find((x) => x.id === it.productId);
      if (p && p.track !== false) p.stock = r2(num(p.stock) + num(it.qty));
    });
  }
  DB.invoices = DB.invoices.filter((i) => i.id !== id);
  saveDB();
  closeModal();
  render();
  toast('Invoice deleted');
}

    if (c) c.textContent = `${shown} product(s)`;
  };
  ['#prodSearch', '#prodCat', '#prodLow'].forEach((sel) => {
    const el = $(sel);
    if (el) el.addEventListener(el.tagName === 'INPUT' && el.type !== 'checkbox' ? 'input' : 'change', apply);
  });
}

function unitOptions(current) {
  const units = ['pcs', 'kg', 'g', 'ltr', 'ml', 'pack', 'box', 'bag', 'plate', 'cup', 'ream', 'dozen', 'service', 'hour'];
  return units.map((u) => `<option ${current === u ? 'selected' : ''}>${u}</option>`).join('') + `<option ${current && !units.includes(current) ? 'selected' : ''}>${current && !units.includes(current) ? esc(current) : ''}</option>`;
}

function openProductModal(id, forBill) {
  const p = id ? DB.products.find((x) => x.id === id) : null;

  const data = p || { name: '', sku: '', category: '', unit: 'pcs', cost: 0, price: 0, stock: 0, lowStock: 5, vat: true, track: true };

        <div class="field"><label>Unit</label><select class="input" name="unit">${unitOptions(data.unit)}</select></div>
        <div class="field"><label>Purchase cost</label><input class="input" name="cost" type="number" min="0" step="any" value="${num(data.cost)}"></div>
        <div class="field"><label>Selling price</label><input class="input" name="price" type="number" min="0" step="any" value="${num(data.price)}"></div>
        <div class="field"><label>Stock quantity</label><input class="input" name="stock" type="number" min="0" step="any" value="${num(data.stock)}"><small>Changes are logged as manual adjustment.</small></div>
        <div class="field"><label>Low stock alert at</label><input class="input" name="lowStock" type="number" min="0" step="any" value="${num(data.lowStock)}"></div>
        <div class="field"><label>Options</label>
          <label class="check"><input type="checkbox" name="vat" ${data.vat !== false ? 'checked' : ''}> Apply VAT</label>
          <label class="check"><input type="checkbox" name="track" ${data.track !== false ? 'checked' : ''}> Track stock</label>
        </div>
      </div>
    </form>`,
    footer: `<button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button type="submit" form="productForm" class="btn primary">${p ? 'Save changes' : 'Add product'}</button>`,
  });
  $('#productForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    if (!name) { toast('Product name is required', 'warn'); return; }
    const payload = {
      name,
      sku: String(fd.get('sku') || '').trim(),
      category: String(fd.get('category') || '').trim(),
      unit: String(fd.get('unit') || 'pcs'),
      cost: num(fd.get('cost')),
      price: num(fd.get('price')),
      stock: num(fd.get('stock')),
      lowStock: num(fd.get('lowStock')),
      vat: form.elements.vat.checked,
      track: form.elements.track.checked,
    };
    if (payload.stock < 0) { toast('Stock cannot be negative', 'warn'); return; }
    if (p) {
      const oldStock = num(p.stock);
      Object.assign(p, payload);
      if (num(payload.stock) !== oldStock) {
        DB.adjustments.unshift({ id: uid(), date: todayISO(), productId: p.id, type: num(payload.stock) > oldStock ? 'in' : 'out', qty: Math.abs(num(payload.stock) - oldStock), reason: 'Manual correction', createdAt: new Date().toISOString() });
      }
      toast('Product updated');
    } else {
      const np = { id: uid(), ...payload, createdAt: new Date().toISOString() };
      DB.products.push(np);
      if (num(np.stock) > 0) DB.adjustments.unshift({ id: uid(), date: todayISO(), productId: np.id, type: 'in', qty: num(np.stock), reason: 'Opening stock', createdAt: new Date().toISOString() });
      toast('Product added');
    }
    saveDB();
    closeModal();
    render();
    if (forBill && currentPage !== 'billing') navigate('billing');
  });
}

function openStockIn(id) {

  });

function openAdjust(id) {
  const p = DB.products.find((x) => x.id === id);
  if (!p) return;
  openModal({
    title: `Adjust stock · ${esc(p.name)}`,
    body: `<form id="adjustForm">
      <div class="pay-summary"><div><span>Current stock</span><b>${num(p.stock)} ${esc(p.unit || '')}</b></div></div>
      <div class="form-grid" style="margin-top:14px">
        <div class="field"><label>Adjustment type</label><select class="input" name="type"><option value="in">Add stock (+)</option><option value="out">Remove stock (−)</option></select></div>
        <div class="field"><label>Quantity *</label><input class="input" name="qty" type="number" min="0.01" step="any" value="1" required></div>
        <div class="field span-2"><label>Reason</label><input class="input" name="reason" placeholder="e.g. Damage, expiry, stock count correction" required></div>
      </div>
    </form>`,
    footer: `<button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button type="submit" form="adjustForm" class="btn primary">Apply adjustment</button>`,
  });
  $('#adjustForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const type = String(fd.get('type'));
    const qty = num(fd.get('qty'));
    if (qty <= 0) { toast('Quantity must be greater than zero', 'warn'); return; }
    if (type === 'out' && qty > num(p.stock)) { toast(`Cannot remove more than ${num(p.stock)} ${p.unit || ''}`, 'error'); return; }
    p.stock = r2(num(p.stock) + (type === 'in' ? qty : -qty));
    DB.adjustments.unshift({ id: uid(), date: todayISO(), productId: p.id, type, qty, reason: String(fd.get('reason') || '').trim() || 'Stock adjustment', createdAt: new Date().toISOString() });

    closeModal();
    render();
    toast('Stock adjusted');
  });
}

function openProductHistory(id) {
  const p = DB.products.find((x) => x.id === id);
  if (!p) return;
  const events = [];
  DB.invoices.forEach((inv) => {
    if (inv.type === 'estimate') return;
    inv.items.forEach((it) => {
      if (it.productId === id) events.push({ date: inv.date, kind: 'Sale', qty: -num(it.qty), ref: inv.no, who: inv.party?.name || 'Walk-in Customer' });
    });
  });
  DB.purchases.forEach((pu) => {
    pu.items.forEach((it) => {
      if (it.productId === id) events.push({ date: pu.date, kind: 'Purchase', qty: num(it.qty), ref: pu.no, who: pu.party?.name || 'Supplier' });
    });
  });
  DB.adjustments.filter((a) => a.productId === id).forEach((a) => {
    events.push({ date: a.date, kind: a.type === 'in' ? 'Stock in' : 'Stock out', qty: a.type === 'in' ? num(a.qty) : -num(a.qty), ref: a.reason || 'Adjustment', who: '' });
  });
  events.sort((a, b) => b.date.localeCompare(a.date));
  openModal({
    title: `Stock history · ${esc(p.name)}`,
    wide: true,
    body: `<div class="pay-summary"><div><span>Current stock</span><b>${num(p.stock)} ${esc(p.unit || '')}</b></div><div><span>Purchase cost</span><b>${money(p.cost)}</b></div><div><span>Selling price</span><b>${money(p.price)}</b></div></div>
      ${events.length ? `<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Party / reason</th><th class="r">Qty</th></tr></thead><tbody>
      ${events.map((ev) => `<tr><td>${formatDate(ev.date)}</td><td>${esc(ev.kind)}</td><td>${esc(ev.ref)}</td><td>${esc(ev.who)}</td><td class="r ${ev.qty < 0 ? 'red-text' : 'green-text'}"><strong>${ev.qty > 0 ? '+' : ''}${fmt(ev.qty)}</strong></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">No stock movements recorded for this product.</div>`}`,
    footer: `<button type="button" class="btn ghost" data-act="close-modal">Close</button>`,
  });
}

function deleteProduct(id) {

  toast('Product deleted');
}

function mountPurchases() {
  if (purchaseDraft) {
    const p = purchaseDraft;
    const partyEl = $('#purParty');
    if (partyEl) partyEl.addEventListener('change', () => { p.partyId = partyEl.value; });
    const dateEl = $('#purDate');
    if (dateEl) dateEl.addEventListener('change', () => { p.date = dateEl.value || todayISO(); render(); });
    const billEl = $('#purBillNo');
    if (billEl) billEl.addEventListener('input', () => { p.supplierBillNo = billEl.value; });
    const noteEl = $('#purNote');
    if (noteEl) noteEl.addEventListener('input', () => { p.note = noteEl.value; });
    const vatEl = $('#purVat');
    if (vatEl) vatEl.addEventListener('change', () => { p.vat = vatEl.checked; updatePurchaseUI(); });
    const prodEl = $('#purProduct');
    if (prodEl) prodEl.addEventListener('change', () => {
      const opt = prodEl.selectedOptions[0];
      if (opt && opt.value) {
        $('#purRate').value = opt.dataset.cost || '';
        $('#purQty').value = 1;
        $('#purQty').focus();
      }
    });
    const body = $('#purItems');
    if (body) body.addEventListener('input', (e) => {
      const inp = e.target.closest('.cell-input');
      if (!inp) return;
      const i = Number(inp.dataset.idx);
      if (!p.items[i]) return;
      p.items[i][inp.dataset.field] = num(inp.value);
      updatePurchaseUI();
    });
  } else {
    const el = $('#purSearch');
    if (el) el.addEventListener('input', () => {
      const q = el.value.trim().toLowerCase();
      let shown = 0;
      $$('#purRows tr').forEach((tr) => {
        const ok = !q || tr.dataset.search.includes(q);
        tr.style.display = ok ? '' : 'none';
        if (ok) shown++;
      });
      const c = $('#purCount');
      if (c) c.textContent = `${shown} purchase(s)`;
    });
  }
}

function updatePurchaseUI() {
  const p = purchaseDraft;
  const t = calcPurchase(p);
  const set = (sel, v) => { const el = $(sel); if (el) el.textContent = v; };
  set('#purSubtotal', money(t.subtotal));
  set('#purVatTotal', money(t.vat));
  set('#purTotal', money(t.total));
  $$('#purItems tr[data-idx]').forEach((tr) => {
    const it = p.items[Number(tr.dataset.idx)];
    if (!it) return;
    const cell = tr.querySelector('.line-total');
    if (cell) cell.innerHTML = `<strong>${money(num(it.qty) * num(it.rate))}</strong>`;
  });
}

function addPurchaseItem() {
  const p = purchaseDraft;
  const sel = $('#purProduct');
  const pid = sel ? sel.value : '';
  if (!pid) { toast('Select a product first', 'warn'); return; }
  const product = DB.products.find((x) => x.id === pid);
  if (!product) return;
  const qty = num($('#purQty').value) || 1;
  if (qty <= 0) { toast('Quantity must be greater than zero', 'warn'); return; }
  const rate = $('#purRate').value === '' ? num(product.cost) : num($('#purRate').value);
  p.items.push({ productId: product.id, name: product.name, unit: product.unit || '', qty, rate });
  render();
  setTimeout(() => { const q = $('#purQty'); if (q) { q.value = 1; q.focus(); } }, 40);
}

function savePurchase() {
  const p = purchaseDraft;
  if (!p.items.length) { toast('Add at least one item', 'warn'); return; }
  const bad = p.items.find((it) => num(it.qty) <= 0 || num(it.rate) < 0);
  if (bad) { toast('Check quantity and cost of every item', 'warn'); return; }
  const supplier = DB.parties.find((x) => x.id === p.partyId);
  const t = calcPurchase(p);
  const pu = {
    id: uid(),
    no: nextPurchaseNo(p.date),
    date: p.date || todayISO(),
    partyId: p.partyId || '',
    party: supplier ? { name: supplier.name, phone: supplier.phone || '', address: supplier.address || '', pan: supplier.pan || '', vat: supplier.vat || '' } : { name: 'Cash supplier' },
    supplierBillNo: (p.supplierBillNo || '').trim(),
    items: p.items.map((it) => ({ ...it, qty: num(it.qty), rate: num(it.rate) })),
    subtotal: t.subtotal,
    vat: t.vat,
    total: t.total,
    note: (p.note || '').trim(),
    createdAt: new Date().toISOString(),
  };
  pu.items.forEach((it) => {
    const prod = DB.products.find((x) => x.id === it.productId);
    if (!prod || prod.track === false) return;
    const oldStock = num(prod.stock);
    const oldCost = num(prod.cost);
    const newStock = oldStock + num(it.qty);
    if (num(it.rate) > 0) {
      prod.cost = oldStock > 0 ? r2(((oldStock * oldCost) + (num(it.qty) * num(it.rate))) / newStock) : num(it.rate);
    }
    prod.stock = r2(newStock);
  });
  DB.purchases.unshift(pu);
  DB.counters.purchase = (DB.counters.purchase || 0) + 1;
  saveDB();
  purchaseDraft = null;
  render();
  toast(`Purchase ${pu.no} saved · stock updated`);
}

function deletePurchase(id) {
  const p = DB.purchases.find((x) => x.id === id);
  if (!p) return;
  const needed = new Map();
  p.items.forEach((it) => {
    const prod = DB.products.find((x) => x.id === it.productId);
    if (prod && prod.track !== false) needed.set(prod.id, r2((needed.get(prod.id) || 0) + num(it.qty)));
  });
  for (const [pid, qty] of needed) {
    const prod = DB.products.find((x) => x.id === pid);
    if (prod && num(prod.stock) < qty) {
      toast(`Cannot delete: ${prod.name} stock has already been used`, 'error');
      return;
    }
  }
  if (!confirm(`Delete purchase ${p.no}? Stock added by this purchase will be removed.`)) return;
  p.items.forEach((it) => {
    const prod = DB.products.find((x) => x.id === it.productId);
    if (prod && prod.track !== false) prod.stock = r2(num(prod.stock) - num(it.qty));
  });
  DB.purchases = DB.purchases.filter((x) => x.id !== id);
  saveDB();
  render();
  toast('Purchase deleted');
}

/* ---------------- reports ---------------- */
function reportData() {
  const from = ui.report.from || monthStart(todayISO());
  const to = ui.report.to || todayISO();
  const invoices = DB.invoices.filter((i) => i.type !== 'estimate' && i.date >= from && i.date <= to).sort((a, b) => b.date.localeCompare(a.date));
  const purchases = DB.purchases.filter((p) => p.date >= from && p.date <= to).sort((a, b) => b.date.localeCompare(a.date));
  const salesTotal = invoices.reduce((a, i) => a + num(i.total), 0);
  const salesTaxable = invoices.reduce((a, i) => a + num(i.taxable), 0);
  const vatOut = invoices.reduce((a, i) => a + num(i.vat), 0);
  const purchaseTotal = purchases.reduce((a, p) => a + num(p.total), 0);
  const purchaseTaxable = purchases.reduce((a, p) => a + num(p.subtotal), 0);
  const vatIn = purchases.reduce((a, p) => a + num(p.vat), 0);
  let profit = 0;
  invoices.forEach((inv) => inv.items.forEach((it) => { profit += itemNet(it, inv.type) - num(it.qty) * num(it.cost); }));
  const stockValue = DB.products.reduce((a, p) => a + (p.track === false ? 0 : num(p.stock) * num(p.cost)), 0);
  const retailValue = DB.products.reduce((a, p) => a + (p.track === false ? 0 : num(p.stock) * num(p.price)), 0);
  const low = DB.products.filter(isLowStock);
  const topMap = new Map();
  invoices.forEach((inv) => inv.items.forEach((it) => {
    const key = it.productId || it.name;
    const row = topMap.get(key) || { name: it.name, qty: 0, amount: 0 };
    row.qty += num(it.qty);
    row.amount += itemNet(it, inv.type);
    topMap.set(key, row);
  }));
  const top = Array.from(topMap.values()).sort((a, b) => b.amount - a.amount).slice(0, 10);
  const dailyMap = new Map();
  invoices.forEach((inv) => {
    const row = dailyMap.get(inv.date) || { date: inv.date, count: 0, total: 0, vat: 0 };
    row.count++;
    row.total += num(inv.total);
    row.vat += num(inv.vat);
    dailyMap.set(inv.date, row);
  });
  const daily = Array.from(dailyMap.values()).sort((a, b) => b.date.localeCompare(a.date));
  return { from, to, invoices, purchases, salesTotal, salesTaxable, vatOut, purchaseTotal, purchaseTaxable, vatIn, netVat: vatOut - vatIn, profit, stockValue, retailValue, low, top, daily };
}

}

function setReportPreset(preset) {
  const t = todayISO();
  if (preset === 'today') ui.report = { from: t, to: t };
  else if (preset === 'week') ui.report = { from: addDays(t, -6), to: t };
  else if (preset === 'month') ui.report = { from: monthStart(t), to: t };
  else if (preset === 'fy') {
    const bs = adToBs(t);
    const fy = bs ? (bs.month >= 3 ? bs.year : bs.year - 1) : new Date().getFullYear();
    const start = bsToAd(fy, 3, 1) || `${new Date().getFullYear()}-01-01`;
    ui.report = { from: start, to: t };
  } else if (preset === 'all') {
    const dates = [...DB.invoices.map((i) => i.date), ...DB.purchases.map((p) => p.date)].filter(Boolean).sort();
    ui.report = { from: dates[0] || '2000-01-01', to: t };
  }
  render();
}

    s.currency = String(fd.get('currency') || 'Rs.').trim() || 'Rs.';
    s.printSize = String(fd.get('printSize') || 'a4');
    s.bankDetails = String(fd.get('bankDetails') || '').trim();
    s.terms = String(fd.get('terms') || '').trim();
    s.footerNote = String(fd.get('footerNote') || '').trim();
    s.showBS = form.elements.showBS.checked;
    saveDB();
    render();
    toast('Settings saved');
  });
  const logoInput = $('#logoInput');
  if (logoInput) logoInput.addEventListener('change', () => {
    const file = logoInput.files && logoInput.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('Choose an image file', 'warn'); return; }
    resizeImage(file, 360, (dataUrl) => {
      S().logo = dataUrl;
      saveDB();
      render();
      toast('Logo updated');
    });
  });
  const importFile = $('#importFile');
  if (importFile) importFile.addEventListener('change', handleImportFile);
}

function resizeImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/png'));
    };
    img.onerror = () => toast('Could not read that image', 'error');
    img.src = reader.result;
  };
  reader.onerror = () => toast('Could not read that file', 'error');
  reader.readAsDataURL(file);
}

function exportBackup() {
  const data = { ...DB, exportedAt: new Date().toISOString(), app: 'Offline Billing Nepal' };
  download(`billing-backup-${todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('Backup downloaded');
}

function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== 'object' || !Array.isArray(data.products) || !Array.isArray(data.invoices)) throw new Error('Not a valid backup');
      if (!confirm('Replace all current data with this backup?')) return;
      DB = migrate(data);
      saveDB();
      draft = null;
      purchaseDraft = null;
      render();
      toast('Backup restored');
    } catch (err) {
      console.error(err);
      toast('Invalid backup file', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetAll() {
  if (!confirm('Erase ALL products, invoices, purchases, customers and settings?')) return;
  if (!confirm('This cannot be undone. Are you absolutely sure?')) return;
  DB = blankDB();
  saveDB();
  draft = null;
  purchaseDraft = null;
  currentPage = 'dashboard';
  render();
  toast('All data erased');
}

/* ---------------- CSV / downloads ---------------- */
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function csvRows(rows) { return rows.map((r) => r.map(csvCell).join(',')).join('\r\n'); }
function download(filename, content, mime = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function exportSalesCSV() {

    const inv = {
      id: uid(), no: `${DB.settings.invoicePrefix}-${fiscalCompact(date)}-${pad4(DB.counters.invoice + 1)}`,
      type, date, dueDate: '', partyId: party ? party.id : '',
      party: party ? { name: party.name, phone: party.phone || '', address: party.address || '', pan: party.pan || '', vat: party.vat || '' } : { name: 'Walk-in Customer' },
      items, subtotal: totals.subtotal, discount: totals.discount, taxable: totals.taxable, vat: totals.vat, total: totals.total,
      received, due: r2(Math.max(0, totals.total - received)), change: r2(Math.max(0, received - totals.total)),
      payment: paidRatio >= 1 ? 'Cash' : 'Credit', note: '', status: '', createdAt: new Date().toISOString(),
    };
    inv.status = invoiceStatus(inv);
    DB.invoices.push(inv);
    DB.counters.invoice++;
    if (type !== 'estimate') {
      items.forEach((it) => {
        const p = DB.products.find((x) => x.id === it.productId);
        if (p && p.track !== false) p.stock = r2(num(p.stock) - num(it.qty));
      });
    }
  }

  seedInvoice(0, 'vat', customers[0], [[0, 2], [1, 3], [2, 5]], 1);
  seedInvoice(1, 'pan', customers[1], [[8, 3], [9, 2], [10, 4]], 0.5);
  seedInvoice(3, 'vat', null, [[7, 4], [6, 2], [3, 3]], 1);
  seedInvoice(6, 'vat', customers[0], [[11, 2], [10, 5], [5, 1]], 0);
  seedInvoice(9, 'pan', customers[1], [[8, 2], [10, 2]], 1);

  const purchaseDate = addDays(todayISO(), -4);
  const pItems = [[0, 10, 2200], [1, 20, 230], [2, 30, 95]].map(([idx, qty, rate]) => {
    const p = DB.products[idx];
    return { productId: p.id, name: p.name, unit: p.unit, qty, rate };
  });
  const pTotals = calcPurchase({ items: pItems, vat: true, vatRate: DB.settings.vatRate });
  DB.purchases.push({
    id: uid(), no: `PUR-${fiscalCompact(purchaseDate)}-0001`, date: purchaseDate,
    partyId: suppliers[0].id, party: { name: suppliers[0].name, phone: suppliers[0].phone, address: suppliers[0].address, pan: suppliers[0].pan, vat: suppliers[0].vat },
    supplierBillNo: 'HT-2083-118', items: pItems, subtotal: pTotals.subtotal, vat: pTotals.vat, total: pTotals.total,
    note: 'Weekly grocery restock', createdAt: new Date().toISOString(),
  });
  DB.counters.purchase = 1;
  pItems.forEach((it) => {
    const p = DB.products.find((x) => x.id === it.productId);
    if (p && p.track !== false) {
      const oldStock = num(p.stock);
      const newStock = oldStock + num(it.qty);
      p.cost = oldStock > 0 ? r2(((oldStock * num(p.cost)) + (num(it.qty) * num(it.rate))) / newStock) : num(it.rate);
      p.stock = r2(newStock);
    }
  });
  DB.invoices.sort((a, b) => b.date.localeCompare(a.date));
}

function loadDemoData() {
  const hasData = DB.products.length || DB.invoices.length || DB.parties.length;
  if (hasData && !confirm('Load demo data? This will replace all current data.')) return;
  seedDemo();
  saveDB();
  draft = null;
  purchaseDraft = null;
  currentPage = 'dashboard';
  render();
  toast('Demo data loaded');
}
